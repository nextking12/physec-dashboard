spring:
  application:
    name: physical-security-dashboard
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:${PGHOST}}:${POSTGRES_PORT:${PGPORT}}/${POSTGRES_DB:${PGDATABASE}}
    username: ${POSTGRES_USER:${PGUSER}}
    password: ${POSTGRES_PASSWORD:${PGPASSWORD}}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
