spring:
  application:
    name: physical-security-dashboard
  security:
    user:
      name: ${APP_USERNAME:admin}
      password: ${APP_PASSWORD:dev-password}
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:${PGHOST}}:${POSTGRES_PORT:${PGPORT}}/${POSTGRES_DB:${PGDATABASE}}
    username: ${POSTGRES_USER:${PGUSER}}
    password: ${POSTGRES_PASSWORD:${PGPASSWORD}}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
